<header class="w-full h-16 bg-gray-900 border-b border-gray-700 shadow-sm flex items-center justify-between px-6 z-50">
  <!-- Left: Logo + App Title -->
  <div class="flex items-center gap-3">
    <div class="w-9 h-9 rounded-lg bg-indigo-600 flex items-center justify-center">
      <img src="/assets/icons/icon-043b52b2.svg" class="w-5 h-5 text-white   shrink-0" alt="icon" />
    </div>
    <span class="text-xl font-bold text-white tracking-tight">
      Ng console
    </span>
  </div>

  <div class="relative flex items-center gap-2">
    <button
      (click)="toggleAiAssistant()"
      title="AI Assistant (Cmd+K)"
      class="w-9 h-9 rounded-lg flex items-center justify-center text-gray-400 hover:text-white hover:bg-gray-700 transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-400">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" />
        <path d="M5 3v4" />
        <path d="M7 5H3" />
      </svg>
    </button>
    <a
      routerLink="/notifications"
      title="Notifications"
      class="relative w-9 h-9 rounded-lg flex items-center justify-center text-gray-400 hover:text-white hover:bg-gray-700 transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-400">
      <img src="/assets/icons/icon-2c9fcb7e.svg" class="w-5 h-5   shrink-0" alt="icon" />
      <!-- Unread notification badge -->
      <span class="absolute top-1 right-1 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-gray-900 animate-pulse"></span>
    </a>

    <!-- Settings icon link
    <a
      routerLink="/settings"
      title="Settings"
      class="w-9 h-9 rounded-lg flex items-center justify-center text-gray-400 hover:text-white hover:bg-gray-700 transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-400">
      <img src="/assets/icons/icon-b949a719.svg" class="w-5 h-5   shrink-0" alt="icon" />
    </a>
    -->

    <!-- Divider -->
    <div class="w-px h-6 bg-gray-700 mx-1"></div>

    <div class="hidden sm:flex flex-col items-end leading-tight">
      <span class="text-sm font-semibold text-gray-100">{{ currentUser()?.name }}</span>
      <span class="text-xs text-gray-400">{{ currentUser()?.email }}</span>
    </div>

    <button
      (click)="toggleDropdown()"
      class="w-9 h-9 rounded-full bg-indigo-500 text-white text-sm font-bold flex items-center justify-center cursor-pointer hover:bg-indigo-600 transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-400">
      {{ userAvatar() }}
    </button>

    <!-- Dropdown -->
    @if (dropdownOpen()) {
      <div class="fixed inset-0 z-40" role="button" tabindex="0" aria-label="Close menu" (click)="closeDropdown()" (keydown)="closeDropdown()"></div>

      <div class="absolute right-0 top-12 w-52 bg-white rounded-xl shadow-lg border border-gray-100 z-50 overflow-hidden">

        <div class="px-4 py-3 border-b border-gray-100 bg-gray-50">
          <p class="text-sm font-semibold text-gray-800">{{ currentUser()?.name }}</p>
          <p class="text-xs text-gray-500 truncate">{{ currentUser()?.email }}</p>
        </div>

        <ul class="py-1">
          @for (item of menuItems; track item.label) {
            <li>
              @if (item.route) {
                <a
                  [routerLink]="item.route"
                  (click)="closeDropdown()"
                  class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 hover:bg-indigo-50 hover:text-indigo-700 transition-colors cursor-pointer">
                  <img [src]="'/assets/icons/' + item.icon" class="w-4 h-4 shrink-0" alt="icon" />
                  {{ item.label }}
                </a>
              } @else {
                <button
                  class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 hover:bg-indigo-50 hover:text-indigo-700 transition-colors cursor-pointer"
                  (click)="onMenuItemClick(item.label)">
                  <img [src]="'/assets/icons/' + item.icon" class="w-4 h-4 shrink-0" alt="icon" />
                  {{ item.label }}
                </button>
              }
            </li>
          }
        </ul>
      </div>
    }
  </div>
</header>
