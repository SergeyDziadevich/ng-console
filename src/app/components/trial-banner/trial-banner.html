@if (!isHidden() && daysLeft() !== null) {
  <div class="trial-banner">
    <div class="banner-content">
      <span class="message">You have <strong>{{ daysLeft() }}</strong> days left in your free trial.</span>
      <a routerLink="/payments/subscriptions" class="upgrade-link">Upgrade Now</a>
    </div>
    <button class="close-btn" (click)="dismiss()" aria-label="Dismiss banner">×</button>
  </div>
}
