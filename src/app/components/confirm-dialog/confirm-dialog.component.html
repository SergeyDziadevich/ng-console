<div class="modal-overlay z-50">
  <div class="dialog-container">
    <div class="flex items-center gap-3">
      @if (type() === 'danger') {
        <div class="icon-wrapper danger">
          <img
            class="w-5 h-5 text-red-500 shrink-0"
            src="/assets/icons/icon-danger.svg"
            alt="danger"
          />
        </div>
      } @else if (type() === 'warning') {
        <div class="icon-wrapper warning">
          <img
            class="w-5 h-5 text-yellow-600 shrink-0"
            src="/assets/icons/icon-warning-dialog.svg"
            alt="warning"
          />
        </div>
      }
      <div>
        <h3 class="text-base font-semibold text-gray-800">{{ title() }}</h3>
        <p class="text-sm text-gray-500 mt-0.5">
          @if (text()) {
            {{ text() }}
          }
          <ng-content></ng-content>
        </p>
      </div>
    </div>
    <div class="flex justify-end gap-3">
      <button class="px-4 py-2 btn-secondary" (click)="cancelAction.emit()">
        {{ cancelText() }}
      </button>
      <button
        class="btn-confirm"
        [class.danger]="type() === 'danger'"
        [class.warning]="type() === 'warning'"
        (click)="confirmAction.emit()"
      >
        {{ confirmText() }}
      </button>
    </div>
  </div>
</div>
