<div class="max-w-2xl mx-auto p-6">
  <h1 class="text-2xl font-semibold text-gray-800 mb-4">Settings</h1>

  <div class="bg-gray-800 shadow rounded-lg p-6 border border-gray-700">
    <h2 class="text-xl font-semibold mb-4 text-white">Two-Factor Authentication (2FA)</h2>

    @if (successMessage()) {
      <div class="mb-4 p-4 text-green-300 bg-green-900/40 border border-green-700 rounded-lg">
        {{ successMessage() }}
      </div>
    }

    @if (errorMessage()) {
      <div class="mb-4 p-4 text-red-300 bg-red-900/40 border border-red-700 rounded-lg">
        {{ errorMessage() }}
      </div>
    }

    @if (!qrCodeUrl()) {
      <p class="mb-4 text-gray-300">Protect your account with an extra layer of security.</p>
      <button
        (click)="generate2FA()"
        [disabled]="isGenerating()"
        class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 disabled:opacity-50">
        {{ isGenerating() ? 'Generating...' : 'Setup 2FA' }}
      </button>
    } @else {
      <div class="mb-6">
        <p class="mb-4 text-gray-300">Scan this QR code with your authenticator app:</p>
        <img [src]="qrCodeUrl()" alt="2FA QR Code" class="mb-6 border-4 border-white rounded-lg inline-block bg-white" />

        <form [formGroup]="twoFactorForm" (ngSubmit)="turnOn2FA()">
          <div class="mb-4 max-w-xs">
            <label for="code" class="block text-sm font-medium text-gray-300 mb-1">Verification Code</label>
            <input
              type="text"
              id="code"
              formControlName="code"
              placeholder="123456"
              class="w-full rounded-lg bg-gray-700 border border-gray-600 px-4 py-2 text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors" />
          </div>
          <button
            type="submit"
            [disabled]="isSubmitting() || twoFactorForm.invalid"
            class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 disabled:opacity-50">
            {{ isSubmitting() ? 'Verifying...' : 'Verify & Enable' }}
          </button>
          <button
            type="button"
            (click)="qrCodeUrl.set(null)"
            class="ml-3 text-gray-400 hover:text-gray-200">
            Cancel
          </button>
        </form>
      </div>
    }
  </div>
</div>
