<div class="flex flex-col h-full max-w-3xl mx-auto gap-4">
  <h1 class="text-2xl font-semibold text-gray-800">AI Assistant</h1>

  <!-- Message list -->
  <div class="flex-1 overflow-y-auto flex flex-col gap-3 bg-white rounded-xl p-4 shadow-sm min-h-0" role="log" aria-label="Chat messages" aria-live="polite">
    @if (messages().length === 0) {
      <p class="text-gray-400 text-sm text-center mt-8">Ask me anything to get started ✨</p>
    }
    @for (msg of messages(); track $index) {
      <div
        class="max-w-[80%] px-4 py-2 rounded-2xl text-sm leading-relaxed whitespace-pre-wrap"
        [class.self-end]="msg.role === 'user'"
        [class.bg-indigo-600]="msg.role === 'user'"
        [class.text-white]="msg.role === 'user'"
        [class.self-start]="msg.role === 'model'"
        [class.bg-gray-100]="msg.role === 'model'"
        [class.text-gray-800]="msg.role === 'model'"
      >
        <app-weather-widget [text]="msg.text"></app-weather-widget>
      </div>
    }
    @if (loading()) {
      <div class="self-start bg-gray-100 text-gray-400 text-sm px-4 py-2 rounded-2xl animate-pulse" aria-label="Loading response">
        Thinking…
      </div>
    }
  </div>

  <!-- Error -->
  @if (error()) {
    <p class="text-red-500 text-sm" role="alert">{{ error() }}</p>
  }

  <!-- Input -->
  <div class="flex gap-2">
    <textarea
      class="flex-1 resize-none rounded-xl border border-gray-300 px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
      rows="2"
      placeholder="Type a message… (Enter to send)"
      [value]="prompt()"
      (input)="updatePrompt($any($event.target).value)"
      (keydown)="handleKeydown($event)"
      aria-label="Message input"
    ></textarea>
    <button
      class="px-5 py-2 rounded-xl bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
      (click)="send()"
      [disabled]="loading() || !prompt().trim()"
      aria-label="Send message"
    >Send</button>
  </div>
</div>
