<div class="mt-2 mb-2 w-full max-w-2xl bg-white/80 backdrop-blur-md rounded-2xl shadow-sm border border-indigo-100/50 overflow-hidden">
  <div class="px-5 py-4 border-b border-indigo-50 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-indigo-100 text-indigo-600 flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
          <path d="M9 6a3 3 0 11-6 0 3 3 0 016 0zM17 6a3 3 0 11-6 0 3 3 0 016 0zM12.93 17c.046-.327.07-.66.07-1a6.97 6.97 0 00-1.5-4.33A5 5 0 0119 16v1h-6.07zM6 11a5 5 0 015 5v1H1v-1a5 5 0 015-5z" />
        </svg>
      </div>
      <h3 class="font-semibold text-gray-800">Database Users</h3>
    </div>
    <span class="text-xs font-bold px-2.5 py-1 bg-indigo-500 text-white rounded-full shadow-sm">{{ users.length }} Users</span>
  </div>
  <div class="p-5 max-h-[400px] overflow-y-auto custom-scrollbar">
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      @for (user of users; track user.username) {
        <div 
          (click)="onUserClick(user.username)"
          class="group flex items-center gap-3 p-3 rounded-xl bg-gray-50/50 hover:bg-white transition-all border border-gray-100 hover:border-indigo-200 hover:shadow-sm cursor-pointer"
        >
          <div class="flex-shrink-0 w-10 h-10 rounded-full bg-gradient-to-br from-indigo-400 to-purple-500 flex items-center justify-center text-white font-bold shadow-inner text-sm transition-transform group-hover:scale-105">
            {{ user.avatar }}
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-semibold text-gray-900 truncate">{{ user.name }}</p>
            <p class="text-xs text-gray-500 truncate">@{{ user.username }}</p>
          </div>
          <div class="flex-shrink-0">
            <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-bold uppercase tracking-wider border {{ getRoleClasses(user.role) }}">
              {{ user.role }}
            </span>
          </div>
        </div>
      }
    </div>
  </div>
</div>
