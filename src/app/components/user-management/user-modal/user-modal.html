<div class="modal-overlay z-40">
  <div class="relative z-50 w-full max-w-md bg-white rounded-2xl shadow-2xl p-8 flex flex-col gap-6">

    <!-- Header -->
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center">
          <ng-content select="[modal-icon]"></ng-content>
        </div>
        <h2 class="text-xl font-semibold text-gray-800">{{ title() }}</h2>
      </div>
      <button
        type="button"
        (click)="closeModal.emit()"
        class="text-gray-400 hover:text-gray-600 transition-colors rounded-lg p-1 hover:bg-gray-100">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    @if (error()) {
      <p class="error-message">{{ error() }}</p>
    }

    <!-- Form: body projected -->
    <form (submit)="handleSubmit($event)">
      <div class="flex flex-col gap-4">
        <ng-content></ng-content>
      </div>

      <div class="flex justify-end gap-3 pt-4 mt-2 border-t border-gray-100">
        <button type="button" (click)="closeModal.emit()" class="px-5 py-2 btn-secondary">
          Cancel
        </button>
        <button type="submit" class="px-5 py-2 btn-primary" [disabled]="submitDisabled()">
          {{ submitLabel() }}
        </button>
      </div>
    </form>

  </div>
</div>
