<!-- Backdrop -->
<div
  class="fixed inset-0 z-40 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4"
  (click)="close()">

  <!-- Modal card -->
  <div
    class="relative z-50 w-full max-w-md bg-white rounded-2xl shadow-2xl p-8 flex flex-col gap-6"
    (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M18 7.5v3m0 0v3m0-3h3m-3 0h-3m-2.25-4.125a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0ZM3 19.235v-.11a6.375 6.375 0 0 1 12.75 0v.109A12.318 12.318 0 0 1 9.374 21c-2.331 0-4.512-.645-6.374-1.766Z" />
          </svg>
        </div>
        <h2 class="text-xl font-semibold text-gray-800">Add New User</h2>
      </div>
      <button
        (click)="close()"
        class="text-gray-400 hover:text-gray-600 transition-colors rounded-lg p-1 hover:bg-gray-100">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Form -->
    <div class="flex flex-col gap-4">

      <!-- Name -->
      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-gray-700">Full Name</label>
        <input
          type="text"
          placeholder="John Doe"
          [value]="name()"
          (input)="name.set($any($event.target).value)"
          class="px-4 py-2 rounded-lg border text-sm outline-none transition-all focus:ring-2 focus:ring-blue-400"
          [class.border-red-400]="submitted() && nameError()"
          [class.border-gray-300]="!(submitted() && nameError())" />
        @if (submitted() && nameError()) {
          <span class="text-xs text-red-500 flex items-center gap-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0Zm-8-5a.75.75 0 0 1 .75.75v4.5a.75.75 0 0 1-1.5 0v-4.5A.75.75 0 0 1 10 5Zm0 10a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" clip-rule="evenodd" />
            </svg>
            {{ nameError() }}
          </span>
        }
      </div>

      <!-- Email -->
      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-gray-700">Email Address</label>
        <input
          type="email"
          placeholder="john@example.com"
          [value]="email()"
          (input)="email.set($any($event.target).value)"
          class="px-4 py-2 rounded-lg border text-sm outline-none transition-all focus:ring-2 focus:ring-blue-400"
          [class.border-red-400]="submitted() && emailError()"
          [class.border-gray-300]="!(submitted() && emailError())" />
        @if (submitted() && emailError()) {
          <span class="text-xs text-red-500 flex items-center gap-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0Zm-8-5a.75.75 0 0 1 .75.75v4.5a.75.75 0 0 1-1.5 0v-4.5A.75.75 0 0 1 10 5Zm0 10a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" clip-rule="evenodd" />
            </svg>
            {{ emailError() }}
          </span>
        }
      </div>

      <!-- Password -->
      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-gray-700">Password</label>
        <input
          type="password"
          placeholder="Min. 8 characters"
          [value]="password()"
          (input)="password.set($any($event.target).value)"
          class="px-4 py-2 rounded-lg border text-sm outline-none transition-all focus:ring-2 focus:ring-blue-400"
          [class.border-red-400]="submitted() && passwordError()"
          [class.border-gray-300]="!(submitted() && passwordError())" />
        @if (submitted() && passwordError()) {
          <span class="text-xs text-red-500 flex items-center gap-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0Zm-8-5a.75.75 0 0 1 .75.75v4.5a.75.75 0 0 1-1.5 0v-4.5A.75.75 0 0 1 10 5Zm0 10a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" clip-rule="evenodd" />
            </svg>
            {{ passwordError() }}
          </span>
        }
      </div>

      <!-- Role -->
      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-gray-700">Role</label>
        <select
          [value]="role()"
          (change)="role.set($any($event.target).value)"
          class="px-4 py-2 rounded-lg border border-gray-300 text-sm outline-none focus:ring-2 focus:ring-blue-400 bg-white">
          <option value="admin">Admin</option>
          <option value="editor">Editor</option>
          <option value="viewer">Viewer</option>
        </select>
      </div>

    </div>

    <!-- Actions -->
    <div class="flex justify-end gap-3 pt-2 border-t border-gray-100">
      <button
        (click)="close()"
        class="px-5 py-2 rounded-lg border border-gray-300 text-sm text-gray-700 hover:bg-gray-50 transition-all">
        Cancel
      </button>
      <button
        (click)="submit()"
        class="px-5 py-2 rounded-lg bg-blue-500 text-white text-sm font-medium hover:bg-blue-600 active:scale-95 transition-all">
        Add User
      </button>
    </div>

  </div>
</div>
