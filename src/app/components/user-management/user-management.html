<div class="overflow-x-auto rounded-lg shadow">
  <table class="min-w-full divide-y divide-gray-200 bg-white text-sm">
    <thead class="bg-gray-50">
      <tr>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Role</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-gray-100">
      @for (user of users(); track user.id) {
        <tr class="hover:bg-gray-50 transition-colors">
          <td class="px-6 py-4 whitespace-nowrap text-gray-500">{{ user.id }}</td>
          <td class="px-6 py-4 whitespace-nowrap font-medium text-gray-900">{{ user.name }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-gray-600">{{ user.email }}</td>
          <td class="px-6 py-4 whitespace-nowrap">
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800">
              {{ user.role ?? 'N/A' }}
            </span>
          </td>
          <td class="px-6 py-4 whitespace-nowrap space-x-2">
            <button
              (click)="editUser(user)"
              class="inline-flex items-center px-3 py-1.5 text-xs font-medium rounded-md bg-indigo-600 text-white hover:bg-indigo-700 transition-colors">
              Edit
            </button>
            <button
              (click)="deleteUser(user)"
              class="inline-flex items-center px-3 py-1.5 text-xs font-medium rounded-md bg-red-600 text-white hover:bg-red-700 transition-colors">
              Delete
            </button>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="5" class="px-6 py-10 text-center text-gray-400">No users found.</td>
        </tr>
      }
    </tbody>
  </table>
</div>
