<div class="h-full flex flex-col gap-4">
  <!-- Toolbar -->
  <div class="flex flex-wrap items-center justify-between gap-3">

    <!-- Filter -->
    <div class="flex items-center gap-2">
      <select
        [ngModel]="filterField()"
        (ngModelChange)="filterField.set($event)"
        class="px-3 py-2 form-input border-gray-300 bg-white">
        <option value="name">Name</option>
        <option value="email">Email</option>
        <option value="role">Role</option>
      </select>
      <input
        type="text"
        placeholder="Filter value..."
        [ngModel]="filterValue()"
        (ngModelChange)="filterValue.set($event)"
        (keydown.enter)="applyFilter()"
        class="px-3 py-2 form-input border-gray-300 w-48"
      />
      <button
        (click)="applyFilter()"
        class="px-4 py-2 btn-primary">
        Search
      </button>
      @if (userService.filterParams().value) {
        <button
          (click)="clearFilter()"
          class="px-4 py-2 btn-secondary active:scale-95">
          Clear
        </button>
      }
    </div>

    <a
      routerLink="add-user"
      class="flex items-center gap-2 px-4 py-2 btn-primary">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
      </svg>
      Add User
    </a>
  </div>

  @if (usersResource.isLoading()) {
    <div class="flex flex-1 justify-center items-center">
      <div class="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
    </div>
  }

  @if (!usersResource.isLoading() && usersResource.value()) {
    <div class="overflow-x-auto rounded-lg shadow">
      <app-users-table
        [users]="usersResource.value() ?? []"
        (edit)="editUser($event)"
        (delete)="deleteUser($event)"
      ></app-users-table>
    </div>
  }

  @if (usersResource.error()) {
    <div class="flex flex-1 flex-col items-center justify-center gap-4 text-center px-4">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-24 h-24 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
      </svg>
      <div>
        <h2 class="text-xl font-semibold text-gray-800">Something went wrong</h2>
        <p class="mt-1 text-sm text-gray-500">We couldn't load the users. Please try again.</p>
      </div>
      <button
        (click)="usersResource.reload()"
        class="mt-2 px-5 py-2 btn-primary">
        Retry
      </button>
    </div>
  }

  <router-outlet></router-outlet>
</div>

@if (toast()) {
  <app-toast [message]="toast() ?? ''"></app-toast>
}
