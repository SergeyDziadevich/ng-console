<aside
  [class]="collapsed() ? 'w-16' : 'w-64'"
  class="flex flex-col h-full bg-gray-900 text-white transition-all duration-300 ease-in-out shrink-0 overflow-hidden">

  <!-- Header -->
  <div class="flex items-center justify-between px-4 py-5 border-b border-gray-700">
    @if (!collapsed()) {
      <span class="text-lg font-bold tracking-wide whitespace-nowrap">User Mgmt</span>
    }
    <button
      (click)="toggle()"
      class="p-1.5 rounded-md hover:bg-gray-700 transition-colors ml-auto"
      [title]="collapsed() ? 'Expand' : 'Collapse'">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        @if (collapsed()) {
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 5l7 7-7 7M5 5l7 7-7 7" />
        } @else {
          <path stroke-linecap="round" stroke-linejoin="round" d="M11 19l-7-7 7-7M19 19l-7-7 7-7" />
        }
      </svg>
    </button>
  </div>

  <!-- Nav -->
  <nav class="flex-1 overflow-y-auto py-4 space-y-1 px-2">
    @for (item of navItems; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="bg-indigo-600 text-white"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-300 hover:bg-gray-700 hover:text-white transition-colors group">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.icon" />
        </svg>
        @if (!collapsed()) {
          <span class="text-sm font-medium whitespace-nowrap">{{ item.label }}</span>
        }
      </a>
    }
  </nav>

  <!-- Footer -->
  <div class="border-t border-gray-700 px-4 py-4">
    @if (!collapsed()) {
      <div class="flex items-center gap-3">
        <div class="h-8 w-8 rounded-full bg-indigo-500 flex items-center justify-center text-sm font-bold shrink-0">A</div>
        <div class="overflow-hidden">
          <p class="text-sm font-medium leading-tight truncate">Admin</p>
          <p class="text-xs text-gray-400 truncate">admin&#64;app.com</p>
        </div>
      </div>
    } @else {
      <div class="h-8 w-8 rounded-full bg-indigo-500 flex items-center justify-center text-sm font-bold mx-auto">A</div>
    }
  </div>
</aside>
