<div class="modal-overlay z-40">
  <div
    class="relative z-50 w-full max-w-md bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-8 flex flex-col gap-6"
  >
    <!-- Header -->
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center">
          <ng-content select="[modal-icon]"></ng-content>
        </div>
        <h2 class="text-xl font-semibold text-gray-800 dark:text-gray-200">{{ title() }}</h2>
      </div>
      <button
        class="text-gray-400 hover:text-gray-600 dark:text-gray-400 transition-colors rounded-lg p-1 hover:bg-gray-100 dark:bg-gray-700"
        (click)="closeModal.emit()"
        type="button"
      >
        <img class="w-5 h-5 shrink-0" src="/assets/icons/icon-3a40211c.svg" alt="icon" />
      </button>
    </div>

    @if (error()) {
      <p class="error-message">{{ error() }}</p>
    }

    <!-- Form: body projected -->
    <form (submit)="handleSubmit($event)">
      <div class="flex flex-col gap-4">
        <ng-content></ng-content>
      </div>

      <div class="flex justify-end gap-3 pt-4 mt-2 border-t border-gray-100 dark:border-gray-700">
        <button class="px-5 py-2 btn-secondary" (click)="closeModal.emit()" type="button">
          Cancel
        </button>
        <button class="px-5 py-2 btn-primary" [disabled]="submitDisabled()" type="submit">
          {{ submitLabel() }}
        </button>
      </div>
    </form>
  </div>
</div>
