<div class="max-w-2xl mx-auto p-6">
  <div class="bg-white rounded-2xl shadow-sm border p-6 flex flex-col gap-6">
    <div class="flex items-center gap-3 border-b pb-4">
      <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center shrink-0">
        <img src="/assets/icons/icon-documents.svg" class="w-5 h-5 text-blue-500 shrink-0 brightness-0" alt="icon" />
      </div>
      <div>
        <h3 class="text-xl font-bold text-gray-900">Generate Document</h3>
        <p class="text-sm text-gray-500 mt-1">Fill out the details to generate a PDF document from a template.</p>
      </div>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
      <div class="form-group">
        <label class="block text-sm font-medium text-gray-700 mb-1">Template Type</label>
        <select formControlName="templateType" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="invoice">Invoice</option>
          <option value="contract">Contract</option>
          <option value="b2b-contract-pl">B2B IT Contract (Poland)</option>
        </select>
      </div>

      <!-- Invoice Fields -->
      @if (form.get('templateType')?.value === 'invoice') {
        <div class="form-group">
          <label class="block text-sm font-medium text-gray-700 mb-1">Customer Name</label>
          <input type="text" formControlName="customerName" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g. Acme Corp">
        </div>
        <div class="form-group">
          <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
          <input type="text" formControlName="description" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g. Software Development Services">
        </div>
        <div class="form-group">
          <label class="block text-sm font-medium text-gray-700 mb-1">Total Amount ($)</label>
          <input type="number" formControlName="amount" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g. 1500.00">
        </div>
      }

      <!-- Contract Fields -->
      @if (form.get('templateType')?.value === 'contract') {
        <div class="form-group">
          <label class="block text-sm font-medium text-gray-700 mb-1">Party A</label>
          <input type="text" formControlName="partyA" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Your Company Name">
        </div>
        <div class="form-group">
          <label class="block text-sm font-medium text-gray-700 mb-1">Party B</label>
          <input type="text" formControlName="partyB" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Client Name">
        </div>
        <div class="form-group">
          <label class="block text-sm font-medium text-gray-700 mb-1">Terms and Conditions</label>
          <textarea formControlName="terms" rows="4" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter the terms of the contract..."></textarea>
        </div>
      }

      <!-- B2B IT Contract (Poland) Fields -->
      @if (form.get('templateType')?.value === 'b2b-contract-pl') {
        <div class="form-group">
          <label class="block text-sm font-medium text-gray-700 mb-1">Contractor Name (JDG)</label>
          <input type="text" formControlName="contractorName" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g. Jan Kowalski IT Services">
        </div>
        <div class="form-group">
          <label class="block text-sm font-medium text-gray-700 mb-1">Client Name</label>
          <input type="text" formControlName="clientName" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g. Acme Corp Sp. z o.o.">
        </div>
        <div class="form-group">
          <label class="block text-sm font-medium text-gray-700 mb-1">Services Description</label>
          <input type="text" formControlName="servicesDescription" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g. Software architecture and development services">
        </div>
        <div class="form-group">
          <label class="block text-sm font-medium text-gray-700 mb-1">Monthly Net Fee (PLN)</label>
          <input type="number" formControlName="monthlyFee" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g. 15000">
        </div>
        <div class="form-group">
          <label class="block text-sm font-medium text-gray-700 mb-1">Notice Period</label>
          <input type="text" formControlName="noticePeriod" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g. 1 month">
        </div>
      }

      @if (error) {
        <p class="text-sm text-red-500">{{ error }}</p>
      }

      <div class="flex justify-end gap-3 mt-4 pt-4 border-t">
        <button type="button" (click)="onCancel()" class="px-4 py-2 btn-secondary" [disabled]="isGenerating">Cancel</button>
        <button type="submit" class="px-4 py-2 rounded-lg bg-blue-600 text-white text-sm font-medium hover:bg-blue-700 active:scale-95 transition-all disabled:opacity-50" [disabled]="isGenerating">
          {{ isGenerating ? 'Generating...' : 'Generate PDF' }}
        </button>
      </div>
    </form>
  </div>
</div>
