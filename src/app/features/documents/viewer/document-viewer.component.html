<div class="modal-overlay z-50">
  <div
    class="relative z-50 bg-white rounded-2xl shadow-2xl w-full max-w-5xl h-[85vh] flex flex-col border border-gray-200 overflow-hidden"
  >
    <!-- Header -->
    <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100 shrink-0">
      <div class="flex flex-col">
        <h3 class="text-xl font-bold text-gray-800">
          {{ pageTitle() }}
        </h3>
        <p class="text-sm text-gray-500 line-clamp-1 break-words mt-1">{{ documentTitle() }}</p>
      </div>
      <button
        class="text-gray-400 hover:text-gray-700 hover:bg-gray-100 rounded-full p-2 transition-colors"
        (click)="close()"
      >
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          ></path>
        </svg>
      </button>
    </div>

    <!-- Main Content -->
    <div class="flex-1 overflow-hidden flex flex-col p-6 gap-6 relative">
      @if (isLoading()) {
        <div class="absolute inset-0 bg-white/80 z-10 flex flex-col items-center justify-center">
          <div
            class="w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"
          ></div>
          <p class="mt-4 text-gray-600 font-medium">Loading document...</p>
        </div>
      }

      <!-- PDF Viewer -->
      @if (documentPreviewUrl()) {
        <div
          class="flex-1 bg-gray-100 rounded-xl overflow-hidden border border-gray-200 shadow-inner"
          [ngClass]="{ 'h-1/2 shrink-0': previewMode() === 'sign' }"
        >
          <iframe class="w-full h-full border-0" [src]="documentPreviewUrl()"></iframe>
        </div>
      } @else if (!isLoading()) {
        <div
          class="flex-1 flex items-center justify-center bg-gray-50 rounded-xl border border-gray-200 border-dashed"
        >
          <p class="text-gray-500 font-medium">No document available to preview.</p>
        </div>
      }

      <!-- Signature Area -->
      @if (previewMode() === 'sign') {
        <div class="shrink-0 flex flex-col gap-3">
          <div class="flex items-center justify-between">
            <span class="text-sm font-semibold text-gray-700 uppercase tracking-wider"
              >Draw Your Signature</span
            >
            <button
              class="text-xs text-blue-600 hover:text-blue-800 font-bold uppercase tracking-wider transition-colors px-3 py-1 rounded hover:bg-blue-50"
              (click)="clearSignature()"
            >
              Clear
            </button>
          </div>
          <div
            class="border-2 border-dashed border-gray-300 rounded-xl bg-gray-50 flex items-center justify-center relative h-48 shadow-sm group hover:border-blue-400 transition-colors"
          >
            <canvas
              class="w-full h-full cursor-crosshair rounded-xl z-10"
              #signatureCanvas
            ></canvas>
            <div
              class="absolute inset-0 pointer-events-none flex items-center justify-center text-gray-300 opacity-60 select-none group-hover:opacity-30 transition-opacity"
            >
              <span class="text-2xl font-medium tracking-wide">Sign Here</span>
            </div>
          </div>
        </div>
      }
    </div>

    <!-- Footer Actions -->
    <div
      class="flex justify-end items-center gap-4 px-6 py-4 bg-gray-50 border-t border-gray-100 shrink-0"
    >
      <button
        class="px-6 py-2.5 rounded-lg border border-gray-300 text-gray-700 font-medium hover:bg-white hover:text-gray-900 transition-colors bg-transparent"
        (click)="close()"
      >
        Close
      </button>

      @if (previewMode() === 'sign') {
        <button
          class="px-6 py-2.5 rounded-lg bg-blue-600 text-white font-medium hover:bg-blue-700 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed disabled:active:scale-100 transition-all flex items-center gap-2 shadow-sm hover:shadow"
          [disabled]="isActionLoading() || isLoading()"
          (click)="executeSign()"
        >
          @if (isActionLoading()) {
            <div
              class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"
            ></div>
            Signing...
          } @else {
            <ng-icon class="w-4 h-4" name="lucideFileSignature"></ng-icon>
            Confirm & Sign
          }
        </button>
      }
    </div>
  </div>
</div>

@if (toast()) {
  <app-toast [message]="toast() || ''"></app-toast>
}
