<div
  class="mt-2 mb-2 w-full max-w-2xl bg-white dark:bg-gray-800/80 backdrop-blur-md rounded-2xl shadow-sm border border-indigo-100/50 overflow-hidden"
>
  <div class="px-5 py-4 border-b border-indigo-50 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div
        class="w-8 h-8 rounded-lg bg-indigo-100 text-indigo-600 flex items-center justify-center"
      >
        <img class="h-5 w-5 shrink-0" src="/assets/icons/icon-731e8979.svg" alt="icon" />
      </div>
      <h3 class="font-semibold text-gray-800 dark:text-gray-200">Database Users</h3>
    </div>
    <span class="text-xs font-bold px-2.5 py-1 bg-indigo-500 text-white rounded-full shadow-sm"
      >{{ users.length }} Users</span
    >
  </div>
  <div class="p-5 max-h-[400px] overflow-y-auto custom-scrollbar">
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      @for (user of users; track user.username) {
        <div
          class="group flex items-center gap-3 p-3 rounded-xl bg-gray-50 dark:bg-gray-900/50 hover:bg-white dark:hover:bg-gray-800 transition-all border border-gray-100 dark:border-gray-700 hover:border-indigo-200 hover:shadow-sm cursor-pointer"
          (click)="onUserClick(user.username)"
          (keydown.enter)="onUserClick(user.username)"
          tabindex="0"
        >
          <div
            class="flex-shrink-0 w-10 h-10 rounded-full bg-gradient-to-br from-indigo-400 to-purple-500 flex items-center justify-center text-white font-bold shadow-inner text-sm transition-transform group-hover:scale-105"
          >
            {{ user.avatar }}
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-semibold text-gray-900 dark:text-gray-100 truncate">{{ user.name }}</p>
            <p class="text-xs text-gray-500 dark:text-gray-400 truncate">@{{ user.username }}</p>
          </div>
          <div class="flex-shrink-0">
            <span
              class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-bold uppercase tracking-wider border {{
                getRoleClasses(user.role)
              }}"
            >
              {{ user.role }}
            </span>
          </div>
        </div>
      }
    </div>
  </div>
</div>
