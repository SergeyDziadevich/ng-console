<div class="p-6 max-w-2xl mx-auto font-sans text-gray-900">
  <h1 class="text-2xl font-bold flex items-center gap-3 mb-6">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-indigo-600 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
    </svg>
    Notifications 
    <span class="text-xs px-2.5 py-0.5 rounded-full text-white transition-colors" [class.bg-red-600]="!isOnline()" [class.bg-green-600]="isOnline()">
      {{ isOnline() ? 'online' : 'offline' }}
    </span>
  </h1>
  
  <div class="flex gap-2 flex-wrap mb-6">
    <input #titleInput value="Deploy finished" class="px-3 py-2 rounded-md border border-gray-300 bg-white text-gray-800 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 flex-1 min-w-[200px]" />
    <button (click)="sendNotification(titleInput.value)" class="px-4 py-2 rounded-md border border-gray-300 bg-gray-50 hover:bg-gray-100 font-medium transition-colors cursor-pointer shadow-sm">Send</button>
    <button (click)="dropConnection()" class="px-4 py-2 rounded-md border border-gray-300 bg-gray-50 hover:bg-gray-100 font-medium transition-colors cursor-pointer shadow-sm">⚡ Drop connection</button>
    <button (click)="reconnect()" class="px-4 py-2 rounded-md border border-gray-300 bg-gray-50 hover:bg-gray-100 font-medium transition-colors cursor-pointer shadow-sm">🔌 Reconnect</button>
  </div>

  <ul class="list-none p-0 flex flex-col gap-2">
    @for (msg of messages(); track msg) {
      <li 
        class="border rounded-lg px-4 py-2.5 transition-all"
        [class.bg-white]="!msg.isSystem && !msg.replayed"
        [class.border-gray-200]="!msg.isSystem && !msg.replayed"
        [class.text-gray-800]="!msg.isSystem && !msg.replayed"
        [class.shadow-sm]="!msg.isSystem"
        
        [class.bg-yellow-50]="msg.replayed"
        [class.border-yellow-400]="msg.replayed"
        [class.text-yellow-900]="msg.replayed"

        [class.bg-transparent]="msg.isSystem"
        [class.border-dashed]="msg.isSystem"
        [class.border-gray-300]="msg.isSystem"
        [class.text-gray-500]="msg.isSystem"
        [class.italic]="msg.isSystem"
        [class.text-sm]="msg.isSystem"
      >
        <div class="flex justify-between items-center gap-4">
          <div>
            @if (msg.isSystem) {
              {{ msg.title }}
            } @else {
              <b class="font-semibold">{{ msg.title }}</b>
              @if (msg.replayed) {
                <small class="text-yellow-700 font-medium ml-2 text-xs">🔁 REPLAYED</small>
              }
            }
          </div>
          @if (msg.timestamp) {
            <span class="text-xs text-gray-500 whitespace-nowrap">{{ msg.timestamp | date:'short' }}</span>
          }
        </div>
      </li>
    }
  </ul>
</div>
