<div class="modal-overlay z-40">
  <div
    class="relative z-50 w-full max-w-md bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-6 sm:p-8 flex flex-col gap-6"
  >
    <!-- Header -->
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-400 flex items-center justify-center shadow-xs border border-indigo-100 dark:border-indigo-900/50">
          <ng-content select="[modal-icon]"></ng-content>
        </div>
        <h2 class="text-xl font-semibold text-gray-900 dark:text-gray-100">{{ title() }}</h2>
      </div>
      <button
        class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 transition-colors rounded-lg p-1.5 hover:bg-gray-100 dark:hover:bg-gray-700 cursor-pointer"
        (click)="closeModal.emit()"
        type="button"
        aria-label="Close modal"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    @if (error()) {
      <div class="p-3 text-sm text-red-600 bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-900/50 rounded-lg">
        {{ error()! | translate }}
      </div>
    }

    <!-- Form: body projected -->
    <form (submit)="handleSubmit($event)">
      <div class="flex flex-col gap-4">
        <ng-content></ng-content>
      </div>

      <div class="flex items-center justify-end gap-3 pt-5 mt-4 border-t border-gray-100 dark:border-gray-700">
        <button class="px-5 py-2.5 btn-secondary text-sm font-medium cursor-pointer" (click)="closeModal.emit()" type="button">
          {{ 'COMMON.CANCEL' | translate }}
        </button>
        <button class="px-5 py-2.5 btn-primary text-sm font-medium cursor-pointer" [disabled]="submitDisabled()" type="submit">
          {{ submitLabel() }}
        </button>
      </div>
    </form>
  </div>
</div>
